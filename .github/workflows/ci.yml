name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a bot-authored branch with no human push get real CI on demand --
  # internal-package-contract's dependency-pin-sync.yml (called from this
  # repo's own sync-internal-package-contract.yml) dispatches this explicitly
  # after opening its pin-bump PR. (This is NOT needed for the benchmark-pr
  # job's own commit below -- that one genuinely fires its own `pull_request:
  # synchronize` event, contrary to what an earlier version of this comment
  # assumed; see benchmark-pr's own placement/ordering for how that's
  # actually handled now.)
  workflow_dispatch:

# Explicit least-privilege default so every job's GITHUB_TOKEN scope is a
# property of this file, not an assumption about the repo/org's ambient
# default -- mirrors env-cap's own ci.yml.
permissions:
  contents: read

# Core/runtime/runtime-cache/runtime-retry/helpers each carry a gzip budget
# (scripts/check-size.mjs) -- this workflow is what turns that budget from a
# script someone could forget to run into a check every change actually has
# to pass.
#
# NOTE: a job for docs deployment is added once Phase 9's docs site is
# finalized -- see specs/architecture.md.
jobs:
  # Runs first, on every PR, and -- when the PR's own diff touches benchmarked
  # code -- commits refreshed results straight onto the PR branch (see its own
  # steps below for why). Every other job in this workflow now `needs` this
  # one and checks out the PR branch's own live head rather than the
  # originally-triggered SHA, so whatever this job just committed is exactly
  # what `lint`/`contract`/etc. actually validate -- one real commit, one
  # real CI pass, not two. This used to be a separate `benchmarks.yml`
  # workflow running in parallel with this one, with a `carry-forward-
  # required-checks.sh` step trying to copy this workflow's own results onto
  # the benchmark commit after the fact -- that design assumed a
  # `GITHUB_TOKEN`-authored push never fires its own `pull_request:
  # synchronize` (an anti-recursion guard GitHub documents), but in practice
  # it does, which meant every benchmark commit re-triggered a brand-new,
  # separately-gated CI run on top of the carry-forward attempt -- a loop
  # that could re-trigger indefinitely on real benchmark-timing noise between
  # runs. Sequencing it first here, in the same workflow, removes the race
  # (and the carry-forward script) entirely: there's only ever one workflow
  # run per real push, and it validates the state that actually gets merged.
  benchmark-pr:
    # Same-repo PRs only -- a fork PR's GITHUB_TOKEN is read-only here, so the
    # comment/commit/push steps below would just fail loudly; `lint`/`verify`
    # below already treat this job being skipped as a pass (see their own
    # `if:`), so a fork PR still gets full CI, just without the benchmark
    # refresh/comment. `github.actor != 'github-actions[bot]'` is the other
    # half of breaking the loop this job's own module comment describes: once
    # this job's own commit becomes the HEAD that re-triggers this workflow,
    # this run's own benchmark-pr sees itself as the actor and skips
    # remeasuring entirely, so there is nothing left to recommit and no
    # further re-trigger -- bounding a real push to at most one extra
    # re-trigger, never an unbounded chain.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    # Committing refreshed results onto the PR branch below is a real write
    # to that PR's own history -- serialize per-PR so two overlapping runs (a
    # fast second push right behind the first) never race that push, and
    # cancel a stale one outright once a newer commit supersedes it.
    concurrency:
      group: benchmarks-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: npm run build

      - working-directory: benchmarks/performance-runtime
        run: npm install
      - working-directory: benchmarks/performance-buildtime
        run: npm install

      - name: Snapshot main's committed results as "previous"
        run: |
          git show origin/main:benchmarks/performance-runtime/results.json > /tmp/previous-runtime.json || echo '{}' > /tmp/previous-runtime.json
          git show origin/main:benchmarks/performance-buildtime/results.json > /tmp/previous-buildtime.json || echo '{}' > /tmp/previous-buildtime.json

      - run: npm run benchmark

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results
          path: |
            benchmarks/performance-runtime/results.json
            benchmarks/performance-runtime/RESULTS.md
            benchmarks/performance-buildtime/results.json
            benchmarks/performance-buildtime/RESULTS.md
          retention-days: 14

      - name: Post or update the marker-tagged summary comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node benchmarks/render-benchmark-summary.mjs /tmp/previous-runtime.json benchmarks/performance-runtime/results.json /tmp/previous-buildtime.json benchmarks/performance-buildtime/results.json > /tmp/summary.md
          PR="${{ github.event.pull_request.number }}"
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" --jq '.[] | select(.body | startswith("<!-- data-cap-benchmark-summary -->")) | .id' | head -n1)
          if [ -n "$EXISTING" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${EXISTING}" -X PATCH -f body=@/tmp/summary.md
          else
            gh api "repos/${{ github.repository }}/issues/${PR}/comments" -X POST -f body=@/tmp/summary.md
          fi

      - name: Commit refreshed results into this PR, only when it touches benchmarked code
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed through the environment rather than interpolated straight into
          # `run` -- a branch ref is attacker-influenced input and must never be
          # spliced into the shell command text.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD)
          RELEVANT=$(echo "$CHANGED" | grep -E '^(src/|benchmarks/)' | grep -vE '^benchmarks/(performance-[^/]+/(results\.json|RESULTS\.md)$|history/)' || true)
          if [ -z "$RELEVANT" ]; then
            echo "This PR doesn't touch benchmarked code paths -- comment posted above, nothing to commit."
            exit 0
          fi

          node benchmarks/append-benchmark-history.mjs benchmarks/performance-runtime/results.json benchmarks/history/runtime.json
          node benchmarks/append-benchmark-history.mjs benchmarks/performance-buildtime/results.json benchmarks/history/buildtime.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/performance-runtime/results.json benchmarks/performance-runtime/RESULTS.md benchmarks/performance-buildtime/results.json benchmarks/performance-buildtime/RESULTS.md benchmarks/history/runtime.json benchmarks/history/buildtime.json
          if git diff --cached --quiet; then
            echo "Freshly measured results match what's already committed -- nothing to push."
            exit 0
          fi
          git commit -m "chore(benchmarks): refresh results.json"
          git push origin HEAD:"$HEAD_REF"

  # Dev-tooling checks (lint/format/API-report) are a property of the source
  # repo, not the published package's own runtime behavior across Node
  # versions -- unlike `verify` below, running them once on a single modern
  # Node version is correct, not a coverage gap. Splitting them out here
  # also keeps them independent of `verify`'s own Node-version floor.
  lint:
    needs: [benchmark-pr]
    # A skipped dependency isn't a passing one by GitHub's own default job
    # condition -- without this, `lint` (and `verify` below) would themselves
    # always skip whenever benchmark-pr does (every push-to-main run, every
    # fork PR), taking every job that needs them, including `contract`, down
    # with them. `always()` opts back into running on a skip; the explicit
    # result check still blocks on a genuine benchmark-pr failure.
    if: always() && (needs.benchmark-pr.result == 'success' || needs.benchmark-pr.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # refs/pull/<N>/head, not the branch name -- resolves for a fork
          # PR too (whose branch lives in the fork, not this repo), and is
          # the PR's real head commit rather than a speculative merge with
          # main. Falls back to the pushed ref outside pull_request events.
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      # The committed Markdown API report (docs/api-report/) must match a
      # fresh `typedoc --options typedoc.markdown.json` -- a public API
      # change can't land without the report, and the PR diff, updated too.
      - run: npm run docs:api:report:check

  # Matches package.json's own `engines.node` floor (`>=20.0.0`). Was
  # `[18.x, 22.x, 24.x]` until the dev toolchain itself (Vitest 4.x, whose
  # own `engines.node` is `^20.0.0 || ^22.0.0 || >=24.0.0`) stopped running
  # on Node 18 at all -- `vitest run --coverage` can't even start there,
  # so 18.x was never actually being verified, just failing to boot. The
  # `engines.node` promise moved to match what's genuinely tested.
  verify:
    needs: [benchmark-pr]
    # Same reasoning as `lint`'s own identical condition above.
    if: always() && (needs.benchmark-pr.result == 'success' || needs.benchmark-pr.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run schema
      - run: npm run test:coverage
      - run: npm run size
      - run: npm run verify:no-ambient-fs
      - run: npm run verify:no-ambient-child-process

  verify-current:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.x
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run size

  # The org-wide governance gate: internal-package-contract's own 27 checks
  # (mutation, coverage, security-deps/secrets/socket, accessibility,
  # dead-code, docs, licenses, ...) run against this package for real, not
  # just declared as a devDependency. Node 24.x to match
  # internal-package-contract's own engines.node floor.
  contract:
    needs: [verify, lint]
    # Same reasoning as `verify`/`lint`'s own identical-shaped condition: GitHub's default
    # `success()` considers the *entire* transitive dependency graph, not just this job's direct
    # `needs` -- since `verify`/`lint` themselves depend on `benchmark-pr`, a skipped `benchmark-pr`
    # (every push-to-main run, every fork PR) still propagates through as "not success" here even
    # when `verify`/`lint` genuinely ran and passed, silently skipping `contract` itself. Confirmed
    # live: a real PR run where `verify`/`lint` both concluded "success" still skipped `contract`.
    if: always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped') && (needs.lint.result == 'success' || needs.lint.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 -- the Commits check reads origin/main..HEAD.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci
      # internal-package-contract's own runner deletes reports/ and coverage/
      # after the run UNLESS they existed before it started -- pre-creating
      # them here is what makes the mutation-report artifact upload below
      # (and Coverage's own reports) survive past the run at all on a fresh
      # CI checkout, which starts with neither directory present.
      - run: mkdir -p reports coverage
      - run: npm run contract

      # Diagnostic aid, not part of the gate itself: `always()` so a failed
      # Mutation run's exact per-mutant detail (file, mutator, location,
      # status) is downloadable instead of only the summary count `npm run
      # contract` prints to the log -- needed to hand-verify a CI-only
      # "Survived" that never reproduces locally, per each mutant's own real
      # source rather than guessing from the count alone.
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-report
          path: reports/mutation/mutation.json
          retention-days: 5
          if-no-files-found: ignore

      # A contract run is not a pure read: Format/Lint auto-fix, and
      # SecurityDeps/SecuritySocket reconcile .repo-contract/exceptions/*.json
      # (scaffolding a blank stub for any new finding, surfacing a stale
      # record). CI starts from a clean checkout, so any post-run working-tree
      # change means an ungoverned finding or an un-added exception stub
      # slipped through -- fail loudly rather than let it ride along with a
      # green run, matching repo-contract's own identical guard.
      - name: Working tree is clean after the contract run
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The contract run left the working tree dirty. A new finding needs its exception stub filled in and committed (.repo-contract/exceptions/), or a file needs formatting. Run 'npm run contract' locally and commit the result."
            git status --porcelain
            git diff
            exit 1
          fi

  cross-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun test test/cross-runtime/bun.test.ts

      - uses: denoland/setup-deno@4606d5cc6fb3f673efd4f594850e3f4b3e9d29cd # v2
        with:
          deno-version: v2.x
      # --no-check: Deno's type-checker doesn't resolve the sibling .d.ts for
      # a bare relative-path .js import the way tsc/vitest do, and instead
      # infers a type from dist/index.js's own static JS shape -- a Deno
      # import-resolution nuance, not a defect in the shipped declarations
      # (see test/cross-runtime/deno.test.ts's header comment). This job's
      # job is proving execution conformance, which --no-check still fully
      # exercises; type-declaration correctness is already checked by
      # `npm run typecheck` against source in the `verify` job above.
      - run: deno test --no-check --allow-read test/cross-runtime/deno.test.ts

  # Proves each of the 3 curated, audience-facing flagship examples still
  # installs, typechecks, and runs cleanly against the real, just-built
  # package -- each depends on the root package via `file:../..`, which
  # needs `dist/` to already exist. Without this job, an API change could
  # silently break a flagship's own real assertions with nothing to catch
  # it until a human runs one by hand. The final step runs every flagship's
  # own runtime assertions + golden comparison in one vitest pass
  # (test/examples/*.test.ts, each gated on its own node_modules already
  # being installed by the per-example steps above). The other 16 real-
  # mechanism regression fixtures this job used to cover live in
  # `test/integration/` now (see examples/README.md) -- the
  # `integration-fixtures` job below covers those the same way.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: application
        working-directory: examples/application
        run: |
          npm install
          npm run typecheck

      - name: team-service
        working-directory: examples/team-service
        run: |
          npm install
          npm run typecheck

      - name: enterprise-platform
        working-directory: examples/enterprise-platform
        run: |
          npm install
          npm run typecheck

      # Not a fourth tier -- see examples/README.md's "Framework integration"
      # section. `npm run build` (which chains `docs` -> `next build`) is the
      # real assertion: it exercises `useSyncExternalStore`'s SSR path and
      # the globalThis-keyed session secret this example's own README
      # documents finding and fixing, not just a typecheck.
      - name: nextjs-app
        working-directory: examples/nextjs-app
        run: |
          npm install
          npm run build

      - run: npx vitest run test/examples/

  # The 16 real-mechanism regression fixtures relocated out of `examples/`
  # (see examples/README.md) -- same install/typecheck/run-assertions/
  # compare-golden discipline as the `examples` job above, just answering
  # "does data-cap actually work?" instead of "why would I use it?".
  integration-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: basic-standalone
        working-directory: test/integration/runtime-core/basic-standalone
        run: |
          npm install
          npm run typecheck

      - name: server-database-integration
        working-directory: test/integration/runtime-core/server-database-integration
        run: |
          npm install
          npm run typecheck

      - name: optimistic-mutation-concurrency
        working-directory: test/integration/runtime-core/optimistic-mutation-concurrency
        run: |
          npm install
          npm run typecheck

      - name: array-identity-reconciliation
        working-directory: test/integration/runtime-core/array-identity-reconciliation
        run: |
          npm install
          npm run typecheck

      - name: subscription-lifecycle
        working-directory: test/integration/subscriptions/subscription-lifecycle
        run: |
          npm install
          npm run typecheck

      - name: subscription-with-recover
        working-directory: test/integration/subscriptions/subscription-with-recover
        run: |
          npm install
          npm run typecheck

      - name: multi-capability-shared-transport
        working-directory: test/integration/subscriptions/multi-capability-shared-transport
        run: |
          npm install
          npm run typecheck

      - name: socket-io-subscription
        working-directory: test/integration/subscriptions/socket-io-subscription
        run: |
          npm install
          npm run typecheck

      - name: coordinator-dedup
        working-directory: test/integration/coordinator/coordinator-dedup
        run: |
          npm install
          npm run typecheck

      - name: coordinator-isolation
        working-directory: test/integration/coordinator/coordinator-isolation
        run: |
          npm install
          npm run typecheck

      - name: runtime-cache
        working-directory: test/integration/runtime-modules/runtime-cache
        run: |
          npm install
          npm run typecheck

      - name: runtime-retry
        working-directory: test/integration/runtime-modules/runtime-retry
        run: |
          npm install
          npm run typecheck

      - name: tanstack-query-integration
        working-directory: test/integration/adoption-patterns/tanstack-query-integration
        run: |
          npm install
          npm run typecheck

      - name: tsconfig-aliases
        working-directory: test/integration/build-tooling/tsconfig-aliases
        run: |
          npm install
          npm run typecheck

      # Installs shared-schema-package (a sibling file: dependency, not a
      # real npm-published package) automatically as part of its own
      # npm install -- no separate pack/build step needed, unlike a tarball-
      # based cross-package example.
      - name: tsconfig-aliases-consumer
        working-directory: test/integration/build-tooling/tsconfig-aliases-consumer
        run: |
          npm install
          npm run typecheck

      - name: eslint-plugin-usage
        working-directory: test/integration/build-tooling/eslint-plugin-usage
        run: |
          npm install
          npm run typecheck

      - run: npx vitest run test/integration/

  badges:
    needs: [verify, lint, cross-runtime]
    # Same transitive-skip reasoning as `contract`'s own identical-shaped condition above --
    # `verify`/`lint` depend on `benchmark-pr`, which is always skipped on a push-to-main event
    # (it only ever runs for `pull_request`), so without this, GitHub's default `success()` here
    # sees that skipped ancestor and silently skips `badges` (and therefore `deploy` below) even
    # when `verify`/`lint` genuinely ran and passed. Confirmed live on a real push to `main`.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && always() &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped') &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      needs.cross-runtime.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:coverage
      - run: npm run size -- --json coverage/size-summary.json
      - name: Generate badge data
        run: node scripts/generate-badges.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-badges
          path: |
            docs/coverage-badge.json
            docs/size-badge.json
          retention-days: 14

  # Deploys docs/ (the GitHub Pages site) plus the badge JSON `badges` above
  # just produced, in the same run -- no cross-run artifact download, no
  # extra `actions: read` permission, no second workflow file to keep in
  # sync with this one. Only this job needs the `pages`/`id-token`
  # permissions and the `pages` concurrency group -- job-level `permissions`/
  # `concurrency` override the workflow-level default, so `verify`/
  # `verify-current`/`cross-runtime`/`examples`/`integration-fixtures`/
  # `badges` keep running with the workflow's existing minimal default
  # permissions.
  deploy:
    needs: badges
    # Same transitive-skip reasoning as `badges`'/`contract`'s own conditions above -- `badges`'
    # own ancestry runs back through `verify`/`lint` to `benchmark-pr`, which is always skipped on
    # a push-to-main event, so without this, GitHub's default `success()` here still sees that
    # skipped ancestor deep in the chain and silently skips `deploy` even when `badges` genuinely
    # ran and passed. Confirmed live on a real push to `main`.
    if: always() && needs.badges.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify site entry point exists
        run: test -f docs/index.html
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      # The rendered HTML API reference is generated fresh here, never
      # committed -- it lands at maverickcer.github.io/data-cap/api/ alongside
      # the hand-authored landing page. The Markdown report drift check in
      # the `verify` job is what guards the API surface itself.
      - run: npm run docs:api
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-badges
          path: docs
