name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Explicit least-privilege default so every job's GITHUB_TOKEN scope is a
# property of this file, not an assumption about the repo/org's ambient
# default -- mirrors env-cap's own ci.yml.
permissions:
  contents: read

# Core/runtime/runtime-cache/runtime-retry/helpers each carry a gzip budget
# (scripts/check-size.mjs) -- this workflow is what turns that budget from a
# script someone could forget to run into a check every change actually has
# to pass.
#
# NOTE: a job for docs deployment is added once Phase 9's docs site is
# finalized -- see specs/architecture.md.
jobs:
  # Dev-tooling checks (lint/format/API-report) are a property of the source
  # repo, not the published package's own runtime behavior across Node
  # versions -- unlike `verify` below, running them once on a single modern
  # Node version is correct, not a coverage gap. Splitting them out here
  # also keeps them independent of `verify`'s own Node-version floor.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      # The committed Markdown API report (docs/api-report/) must match a
      # fresh `typedoc --options typedoc.markdown.json` -- a public API
      # change can't land without the report, and the PR diff, updated too.
      - run: npm run docs:api:report:check

  # Matches package.json's own `engines.node` floor (`>=20.0.0`). Was
  # `[18.x, 22.x, 24.x]` until the dev toolchain itself (Vitest 4.x, whose
  # own `engines.node` is `^20.0.0 || ^22.0.0 || >=24.0.0`) stopped running
  # on Node 18 at all -- `vitest run --coverage` can't even start there,
  # so 18.x was never actually being verified, just failing to boot. The
  # `engines.node` promise moved to match what's genuinely tested.
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run schema
      - run: npm run test:coverage
      - run: npm run size
      - run: npm run verify:no-ambient-fs
      - run: npm run verify:no-ambient-child-process

  verify-current:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.x
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run size

  # The org-wide governance gate: internal-package-contract's own 27 checks
  # (mutation, coverage, security-deps/secrets/socket, accessibility,
  # dead-code, docs, licenses, ...) run against this package for real, not
  # just declared as a devDependency. Node 24.x to match
  # internal-package-contract's own engines.node floor.
  contract:
    needs: [verify, lint]
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 -- the Commits check reads origin/main..HEAD.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci
      - run: npm run contract

      # A contract run is not a pure read: Format/Lint auto-fix, and
      # SecurityDeps/SecuritySocket reconcile .repo-contract/exceptions/*.json
      # (scaffolding a blank stub for any new finding, surfacing a stale
      # record). CI starts from a clean checkout, so any post-run working-tree
      # change means an ungoverned finding or an un-added exception stub
      # slipped through -- fail loudly rather than let it ride along with a
      # green run, matching repo-contract's own identical guard.
      - name: Working tree is clean after the contract run
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The contract run left the working tree dirty. A new finding needs its exception stub filled in and committed (.repo-contract/exceptions/), or a file needs formatting. Run 'npm run contract' locally and commit the result."
            git status --porcelain
            git diff
            exit 1
          fi

  cross-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun test test/cross-runtime/bun.test.ts

      - uses: denoland/setup-deno@4606d5cc6fb3f673efd4f594850e3f4b3e9d29cd # v2
        with:
          deno-version: v2.x
      # --no-check: Deno's type-checker doesn't resolve the sibling .d.ts for
      # a bare relative-path .js import the way tsc/vitest do, and instead
      # infers a type from dist/index.js's own static JS shape -- a Deno
      # import-resolution nuance, not a defect in the shipped declarations
      # (see test/cross-runtime/deno.test.ts's header comment). This job's
      # job is proving execution conformance, which --no-check still fully
      # exercises; type-declaration correctness is already checked by
      # `npm run typecheck` against source in the `verify` job above.
      - run: deno test --no-check --allow-read test/cross-runtime/deno.test.ts

  # Proves each of the 3 curated, audience-facing flagship examples still
  # installs, typechecks, and runs cleanly against the real, just-built
  # package -- each depends on the root package via `file:../..`, which
  # needs `dist/` to already exist. Without this job, an API change could
  # silently break a flagship's own real assertions with nothing to catch
  # it until a human runs one by hand. The final step runs every flagship's
  # own runtime assertions + golden comparison in one vitest pass
  # (test/examples/*.test.ts, each gated on its own node_modules already
  # being installed by the per-example steps above). The other 16 real-
  # mechanism regression fixtures this job used to cover live in
  # `test/integration/` now (see examples/README.md) -- the
  # `integration-fixtures` job below covers those the same way.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: application
        working-directory: examples/application
        run: |
          npm install
          npm run typecheck

      - name: team-service
        working-directory: examples/team-service
        run: |
          npm install
          npm run typecheck

      - name: enterprise-platform
        working-directory: examples/enterprise-platform
        run: |
          npm install
          npm run typecheck

      # Not a fourth tier -- see examples/README.md's "Framework integration"
      # section. `npm run build` (which chains `docs` -> `next build`) is the
      # real assertion: it exercises `useSyncExternalStore`'s SSR path and
      # the globalThis-keyed session secret this example's own README
      # documents finding and fixing, not just a typecheck.
      - name: nextjs-app
        working-directory: examples/nextjs-app
        run: |
          npm install
          npm run build

      - run: npx vitest run test/examples/

  # The 16 real-mechanism regression fixtures relocated out of `examples/`
  # (see examples/README.md) -- same install/typecheck/run-assertions/
  # compare-golden discipline as the `examples` job above, just answering
  # "does data-cap actually work?" instead of "why would I use it?".
  integration-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: basic-standalone
        working-directory: test/integration/runtime-core/basic-standalone
        run: |
          npm install
          npm run typecheck

      - name: server-database-integration
        working-directory: test/integration/runtime-core/server-database-integration
        run: |
          npm install
          npm run typecheck

      - name: optimistic-mutation-concurrency
        working-directory: test/integration/runtime-core/optimistic-mutation-concurrency
        run: |
          npm install
          npm run typecheck

      - name: array-identity-reconciliation
        working-directory: test/integration/runtime-core/array-identity-reconciliation
        run: |
          npm install
          npm run typecheck

      - name: subscription-lifecycle
        working-directory: test/integration/subscriptions/subscription-lifecycle
        run: |
          npm install
          npm run typecheck

      - name: subscription-with-recover
        working-directory: test/integration/subscriptions/subscription-with-recover
        run: |
          npm install
          npm run typecheck

      - name: multi-capability-shared-transport
        working-directory: test/integration/subscriptions/multi-capability-shared-transport
        run: |
          npm install
          npm run typecheck

      - name: socket-io-subscription
        working-directory: test/integration/subscriptions/socket-io-subscription
        run: |
          npm install
          npm run typecheck

      - name: coordinator-dedup
        working-directory: test/integration/coordinator/coordinator-dedup
        run: |
          npm install
          npm run typecheck

      - name: coordinator-isolation
        working-directory: test/integration/coordinator/coordinator-isolation
        run: |
          npm install
          npm run typecheck

      - name: runtime-cache
        working-directory: test/integration/runtime-modules/runtime-cache
        run: |
          npm install
          npm run typecheck

      - name: runtime-retry
        working-directory: test/integration/runtime-modules/runtime-retry
        run: |
          npm install
          npm run typecheck

      - name: tanstack-query-integration
        working-directory: test/integration/adoption-patterns/tanstack-query-integration
        run: |
          npm install
          npm run typecheck

      - name: tsconfig-aliases
        working-directory: test/integration/build-tooling/tsconfig-aliases
        run: |
          npm install
          npm run typecheck

      # Installs shared-schema-package (a sibling file: dependency, not a
      # real npm-published package) automatically as part of its own
      # npm install -- no separate pack/build step needed, unlike a tarball-
      # based cross-package example.
      - name: tsconfig-aliases-consumer
        working-directory: test/integration/build-tooling/tsconfig-aliases-consumer
        run: |
          npm install
          npm run typecheck

      - name: eslint-plugin-usage
        working-directory: test/integration/build-tooling/eslint-plugin-usage
        run: |
          npm install
          npm run typecheck

      - run: npx vitest run test/integration/

  badges:
    needs: [verify, lint, cross-runtime]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:coverage
      - run: npm run size -- --json coverage/size-summary.json
      - name: Generate badge data
        run: node scripts/generate-badges.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-badges
          path: |
            docs/coverage-badge.json
            docs/size-badge.json
          retention-days: 14

  # Deploys docs/ (the GitHub Pages site) plus the badge JSON `badges` above
  # just produced, in the same run -- no cross-run artifact download, no
  # extra `actions: read` permission, no second workflow file to keep in
  # sync with this one. Only this job needs the `pages`/`id-token`
  # permissions and the `pages` concurrency group -- job-level `permissions`/
  # `concurrency` override the workflow-level default, so `verify`/
  # `verify-current`/`cross-runtime`/`examples`/`integration-fixtures`/
  # `badges` keep running with the workflow's existing minimal default
  # permissions.
  deploy:
    needs: badges
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify site entry point exists
        run: test -f docs/index.html
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      # The rendered HTML API reference is generated fresh here, never
      # committed -- it lands at maverickcer.github.io/data-cap/api/ alongside
      # the hand-authored landing page. The Markdown report drift check in
      # the `verify` job is what guards the API surface itself.
      - run: npm run docs:api
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-badges
          path: docs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
