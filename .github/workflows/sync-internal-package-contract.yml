# Keeps this repo's internal-package-contract pin current. PULLS: a daily check (or a manual run)
# re-resolves the pin with this repo's own GITHUB_TOKEN, so no cross-repository token exists to expire.
name: Sync internal-package-contract version

on:
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: MaverickCER/internal-package-contract/.github/workflows/dependency-pin-sync.yml@1edf1bef02f3ba49e2d19d140ded398a148a0fb1 # v0.13.3
    with:
      dependency-name: internal-package-contract
    secrets:
      # Optional. Without it the run uses GITHUB_TOKEN, which GitHub does not allow to change workflow files.
      PIN_SYNC_TOKEN: ${{ secrets.PIN_SYNC_TOKEN }}
