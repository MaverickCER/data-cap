# Keeps this repo's internal-package-contract pin current. PULLS: a daily check (or a manual run)
# re-resolves the pin with this repo's own GITHUB_TOKEN, so no cross-repository token exists to expire.
# See internal-package-contract's dependency-pin-sync.yml for the bump/PR/merge mechanics.
name: Sync internal-package-contract version

on:
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: MaverickCER/internal-package-contract/.github/workflows/dependency-pin-sync.yml@21adafcf5504058a416fbbde900a1d460837c943 # main
    with:
      dependency-name: internal-package-contract
