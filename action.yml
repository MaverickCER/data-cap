name: "data-cap report"
description: "Runs data-cap --json and turns the result into pull request annotations and one summary comment."
inputs:
  args:
    description: "Arguments for `data-cap --json`, for example '--evidence docs/data.evidence.json --strict-docs --strict-ownership'. Split on whitespace. The manifest, catalog, ownership report and diagrams are not CLI flags; generate them from a build script."
    required: true
  working-directory:
    description: "Directory to run data-cap from."
    required: false
    default: "."
  version:
    description: "Version to run through npx when data-cap is not installed locally. Without a local install and without this input, the action exits 2. Must be a plain version or dist-tag; a malformed version exits 2. A dist-tag such as `latest` runs unpinned, so pin an exact version. Ignored when the project has data-cap installed."
    required: false
    default: ""
  comment:
    description: "Create or update one summary comment on the pull request."
    required: false
    default: "true"
  report-key:
    description: "Names this run's summary comment, so several runs on one pull request (one per package in a monorepo) do not overwrite each other. Empty means the working-directory."
    required: false
    default: ""
  annotations:
    description: "Emit a workflow annotation (::warning or ::error) for each finding."
    required: false
    default: "true"
  github-token:
    description: "Token the summary comment is posted with, through `gh`."
    required: false
    default: ${{ github.token }}
runs:
  using: "composite"
  steps:
    - id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_VERSION: ${{ inputs.version }}
        RESULT_PATH: ${{ runner.temp }}/data-cap-result.json
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/scripts/github-action/run-cli.sh"
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RESULT_PATH: ${{ runner.temp }}/data-cap-result.json
        DO_COMMENT: ${{ inputs.comment }}
        DO_ANNOTATIONS: ${{ inputs.annotations }}
        REPORT_KEY: ${{ inputs.report-key }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/scripts/github-action/report.mjs"
    - shell: bash
      env:
        CLI_EXIT_CODE: ${{ steps.run.outputs.exit-code }}
      run: exit "$CLI_EXIT_CODE"
