name: "data-cap report"
description: "Runs data-cap and turns the result into PR annotations and a summary comment."
inputs:
  args:
    description: "Arguments passed to `data-cap --json`, e.g. '--evidence docs/data.evidence.json --strict-docs --strict-ownership' (the persisted evidence is always composed; --location/--docs/--ownership/--flow are no longer CLI flags, ADR 0066)"
    required: true
  working-directory:
    description: "Directory to run data-cap from."
    required: false
    default: "."
  version:
    description: "data-cap version to fetch via npx when it is not a local devDependency. Required in that case: the action fails rather than run an unpinned `latest`. Ignored when the project has data-cap installed."
    required: false
    default: ""
  comment:
    description: "Upsert a sticky PR summary comment."
    required: false
    default: "true"
  report-key:
    description: "Identifies this invocation's sticky comment, so multiple calls against the same PR (e.g. one per package in a monorepo) don't overwrite each other. Empty defaults to working-directory (resolved in report.mjs, not here -- action.yml input defaults can't reliably reference another input)."
    required: false
    default: ""
  annotations:
    description: "Emit inline ::warning/::error PR annotations."
    required: false
    default: "true"
  github-token:
    description: "Token used for `gh` PR-comment calls."
    required: false
    default: ${{ github.token }}
runs:
  using: "composite"
  steps:
    - id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_VERSION: ${{ inputs.version }}
        RESULT_PATH: ${{ runner.temp }}/data-cap-result.json
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/scripts/github-action/run-cli.sh"
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RESULT_PATH: ${{ runner.temp }}/data-cap-result.json
        DO_COMMENT: ${{ inputs.comment }}
        DO_ANNOTATIONS: ${{ inputs.annotations }}
        REPORT_KEY: ${{ inputs.report-key }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/scripts/github-action/report.mjs"
    - shell: bash
      env:
        CLI_EXIT_CODE: ${{ steps.run.outputs.exit-code }}
      run: exit "$CLI_EXIT_CODE"
